plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}
version = '0.3.0'
group = 'dev.lunachat'
base { archivesName = 'luna-chat-translator-26.2' }
repositories { mavenCentral(); maven { url = 'https://maven.terraformersmc.com/releases/' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
    compileOnly 'com.terraformersmc:modmenu:20.0.2'
    localRuntime 'com.terraformersmc:modmenu:20.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }
fabricApi.configureTests {
    createSourceSet = true
    modId = 'luna_chat_test'
    enableGameTests = false
    enableClientGameTests = true
}
